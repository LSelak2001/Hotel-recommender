<!DOCTYPE html>
<html>

  {% extends "base.html" %}

<head>
  <link rel="stylesheet" href="/static/stil.css">
  <title>Register</title>
</head>
<body>
  {% block content %}
  <h2 style="margin-top: 10px;">Register</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}<p style="color:red">{{ msg }}</p>{% endfor %}
    {% endif %}
  {% endwith %}
  <div class="container-md, align-items-center" style="max-width: 400px; margin: 0 auto;">
    <form method="POST">
      <div class="mb-3">
        <label for="username" class="form-label">Username:</label><br>
        <input type="text" class="form-control" name="username" placeholder="Username" required><br>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label><br>
        <input type="email" class="form-control" name="email" placeholder="Email" required><br>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label><br>
        <input type="password" class="form-control" name="password" placeholder="Password" required><br>
      </div>
      <div class="mb-3">
        <button type="submit" class="btn btn-primary" id="form">Register</button>
      </div>
  </form>

    <p>Already have an account? <a href="/login">Login</a></p>
  </div>

    {% endblock %}
</body>
</html>
