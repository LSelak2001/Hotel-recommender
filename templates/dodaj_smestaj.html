{% extends "index.html" %}

{% block content %}
<div style="background-color: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); text-align: center;">
<form method="post">
    Naziv hotela:<br>
    <input type="text" name="naziv"><br><br>

    Grad:<br>
    <input type="text" name="grad" required><br><br>

    Država:<br>
    <input type="text" name="drzava" required><br><br>

    Kontinent:<br>
    <input type="text" name="kontinet" required><br><br>

    Adresa:<br>
    <input type="text" name="adresa" required><br><br>
    

    Zvezdice:<br>
    <input type="number" name="zvezdice" min="1" max="5" required><br><br>

    Ljubimci:<br>
    <select name="ljubimci" required>
        <option value="">-- Izaberite --</option>
        <option value="1">Da</option>
        <option value="0">Ne</option>
    </select><br><br>

    Vrsta smeštaja:<br>
    <input type="text" name="vrsta_smestaja" required><br><br>

    Obrok:<br>
    <input type="text" name="obrok" required><br><br>

    <button type="submit">Dodaj hotel</button>
</form>
</div>

{% endblock %}
