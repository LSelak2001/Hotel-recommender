<!DOCTYPE html>
<html lang="">

  {% extends "base.html" %}

<head>
  <link rel="stylesheet" href="/static/stil.css">
  <title>Login</title>
</head>
<body>
  {% block content %}
  <h2 style="margin-top: 10px;">Login</h2>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}<p style="color:red">{{ msg }}</p>{% endfor %}
    {% endif %}
  {% endwith %}
  <div class="container-md, align-items-center" style="max-width: 400px; margin: 0 auto;">
  <form method="POST">
    <div class="mb-3">
      <label for="email" class="form-label">Email:</label><br>
      <input type="email" class="form-control" name="email" placeholder="Email" required><br>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password:</label><br>
      <input type="password" class="form-control" name="password" placeholder="Password" required><br>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" name="remember" id="remember">
      <label class="form-check-label" for="remember">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary" id="form">Login</button>
  </form>
  <p>No account? <a href="/register">Register</a></p>
  </div>
</body>

  {% endblock %}

</html>
