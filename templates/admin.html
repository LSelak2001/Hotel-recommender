<!DOCTYPE html>
<html>
<head><title>Admin Dashboard</title></head>
<body>
  <h2>Admin Dashboard</h2>
  <p>Welcome, {{ current_user.username }}</p>

  <h3>All Users</h3>
  <table border="1">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>Email</th>
      <th>Admin</th>
    </tr>
    {% for user in users %}
    <tr>
      <td>{{ user.id }}</td>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>{{ 'Yes' if user.is_admin else 'No' }}</td>
    </tr>
    {% endfor %}
  </table>

  <a href="/logout">Logout</a>
</body>
</html>
